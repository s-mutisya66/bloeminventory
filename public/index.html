<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Bloem &amp; Co Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="login.css">
</head>
<body>
<main class="split">
  <section class="brand" aria-label="Bloem &amp; Co">
    <p class="eyebrow">Inventory</p>
    <h1>Bloem &amp; Co</h1>
    <p class="tagline">Stems, bunches and pots, counted and kept fresh.</p>
  </section>

  <section class="signin">
    <form id="loginForm" novalidate>
      <h2>Sign in</h2>
      <p class="lead">For Bloem &amp; Co staff. Use the username and password set up for the shop.</p>

      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="reveal" id="reveal" aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>

      <p class="error" id="error" role="alert"></p>

      <button type="submit" class="btn btn-primary" id="submitBtn">Sign in</button>
    </form>
  </section>
</main>
<script src="login.js"></script>
</body>
</html>
